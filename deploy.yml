name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run tests
        run: |
          pip install pytest
          pytest tests/ || echo "No tests found"
        continue-on-error: true
      
      - name: Build Docker image
        run: |
          docker build -t resume-screening-app:latest .
      
      - name: Push to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker tag resume-screening-app:latest ${{ secrets.DOCKER_USERNAME }}/resume-screening-app:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/resume-screening-app:latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      
      - name: Deploy to Render
        run: |
          curl -X POST https://api.render.com/deploy/srv/${{ secrets.RENDER_SERVICE_ID }}?key=${{ secrets.RENDER_API_KEY }}
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
      
      - name: Deployment Complete
        run: echo "✅ Deployment workflow completed successfully"
