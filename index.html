<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Screening System</title>
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-main: #1f2937;
            --text-muted: #6b7280;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .main-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            padding: 3rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .main-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.12);
        }

        h1 {
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
        }
        
        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
        }

        .form-label {
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .form-control {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 0.75rem 1.25rem;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }
        
        textarea.form-control {
            resize: vertical;
            min-height: 120px;
        }

        .btn-custom {
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
            padding: 1rem;
            border-radius: 12px;
            border: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(99, 102, 241, 0.25);
        }

        .btn-custom:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(99, 102, 241, 0.3);
            color: white;
        }

        /* Loading Overlay Styles */
        #loadingOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(5px);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(99, 102, 241, 0.2);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 1rem;
            font-weight: 600;
            color: var(--primary-color);
            font-size: 1.2rem;
        }
        
        .alert-error {
            background-color: #fee2e2;
            border-left: 4px solid #ef4444;
            color: #b91c1c;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>

<body>

    <!-- Loading Overlay -->
    <div id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text">Analyzing Resumes... Please wait.</div>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="main-card">
                
                    <div class="text-center">
                        <h1>Resume Scanner</h1>
                        <p class="subtitle">AI-powered job matching & candidate screening</p>
                    </div>

                    {% if error %}
                    <div class="alert-error">
                        <i class="fas fa-exclamation-circle"></i>
                        <span>{{ error }}</span>
                    </div>
                    {% endif %}

                    <form id="uploadForm" action="/analyze" method="POST" enctype="multipart/form-data">

                        <div class="mb-4">
                            <label class="form-label">
                                <i class="fas fa-briefcase me-2 text-primary"></i>Job Description
                            </label>
                            
                            <ul class="nav nav-pills mb-3" id="jdTab" role="tablist">
                              <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="text-tab" data-bs-toggle="pill" data-bs-target="#text-input" type="button" role="tab" aria-controls="text-input" aria-selected="true"><i class="fas fa-keyboard me-2"></i>Paste Text</button>
                              </li>
                              <li class="nav-item" role="presentation">
                                <button class="nav-link" id="file-tab" data-bs-toggle="pill" data-bs-target="#file-input" type="button" role="tab" aria-controls="file-input" aria-selected="false"><i class="fas fa-file-pdf me-2"></i>Upload PDF</button>
                              </li>
                            </ul>
                            
                            <div class="tab-content" id="jdTabContent">
                              <div class="tab-pane fade show active" id="text-input" role="tabpanel" aria-labelledby="text-tab">
                                <input type="text" name="job_title" id="job_title" class="form-control mb-3" placeholder="Enter Job Title (e.g. Data Scientist)">
                                <textarea name="job_desc" id="job_desc_textarea" class="form-control" placeholder="Paste the full job description here... Requirements, skills, responsibilities."></textarea>
                              </div>
                              <div class="tab-pane fade" id="file-input" role="tabpanel" aria-labelledby="file-tab">
                                <input type="text" name="job_title_file" id="job_title_file" class="form-control mb-3" placeholder="Enter Job Title (Optional - for single PDF)">
                                <input type="file" name="job_desc_file" id="job_desc_file" class="form-control" accept=".pdf" multiple>
                                <div class="form-text text-muted mt-2">
                                    <i class="fas fa-info-circle me-1"></i> Upload one or more PDFs. If uploading multiple, the filenames will be used as the job titles.
                                </div>
                              </div>
                            </div>
                        </div>

                        <div class="mb-5">
                            <label class="form-label">
                                <i class="fas fa-users me-2 text-danger"></i>Upload Candidate Resumes (PDF only)
                            </label>
                            <input type="file" name="resumes" class="form-control" accept=".pdf" multiple required>
                            <div class="form-text text-muted mt-2">
                                <i class="fas fa-info-circle me-1"></i> You can select multiple PDF files at once.
                            </div>
                        </div>

                        <button type="submit" class="btn btn-custom w-100 btn-lg" id="submitBtn">
                            <i class="fas fa-magic me-2"></i>Analyze Candidates
                        </button>

                    </form>

                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', function(event) {
            
            const jdText = document.getElementById('job_desc_textarea').value.trim();
            const jdFile = document.getElementById('job_desc_file').files.length;
            
            if (!jdText && jdFile === 0) {
                event.preventDefault();
                alert("Please provide a Job Description (either paste text or upload a PDF).");
                return;
            }
            
            // Show loading overlay
            document.getElementById('loadingOverlay').style.display = 'flex';
            // Disable button to prevent double submission
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('submitBtn').innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Processing...';
        });
    </script>
</body>

</html>
